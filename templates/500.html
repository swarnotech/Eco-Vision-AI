
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 550px;
        }

        h1 {
            font-size: 100px;
            color: #333;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 26px;
            color: #222;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
        }

        .error-code {
            margin-top: 25px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>
            Sorry! Something went wrong while processing your request.
            Please try again later.
        </p>
        <div class="error-code">HTTP ERROR 500</div>
    </div>

</body>
</html>
