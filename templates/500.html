
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error | EcoVision AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            color: #26352b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            background: white;
            max-width: 550px;
            width: 100%;
            padding: 55px 30px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        .error-code {
            font-size: 90px;
            font-weight: bold;
            color: #dc665d;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 15px;
        }

        p {
            color: #778078;
            line-height: 1.7;
            font-size: 16px;
        }

        .error-label {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            background: #fff0ef;
            color: #c44c43;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
        }

        .brand {
            margin-top: 35px;
            color: #287a4b;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="error-container">

        <div class="error-code">500</div>

        <h1>Internal Server Error</h1>

        <p>
            Sorry! Something went wrong while processing
            your request. The server encountered an unexpected
            condition and could not complete your request.
        </p>

        <div class="error-label">
            HTTP ERROR 500
        </div>

        <div class="brand">
            🌿 EcoVision AI
        </div>

    </div>
</body>
</html>
